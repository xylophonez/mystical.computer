[package]
name = "dev_whisper"
version = "0.1.0"
edition = "2021"

[lib]
name = "hb_whisper_nif"
path = "src/lib.rs"
crate-type = ["dylib"]

[profile.release]
lto = false
codegen-units = 1

[dependencies]
rustler = "0.36.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

# Whisper GGML inference - wraps whisper.cpp
whisper-rs = "0.16"

# Multi-format audio decoding - pure Rust, no external deps.
# Enables: MP3, AAC/M4A, OGG (Vorbis), FLAC, WAV.
symphonia = { version = "0.5", features = [
    "mp3",
    "aac",
    "vorbis",
    "flac",
    "wav",
] }
